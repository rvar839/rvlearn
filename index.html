<style>
/* Layout: one phone-width column. A study view or list fills the screen; four tabs sit at the bottom in thumb reach. */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --ink:#141b2d; --muted:#6a7389; --line:#e1e5ee;
  --accent:#2f43c4; --accent-ink:#ffffff; --accent-soft:#e8ebfb; --accent-mid:#97a2e2;
  --good:#1c7c4a; --good-soft:#e0f3e8; --bad:#b3261e; --bad-soft:#fbe6e4;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1220; --surface:#171c2d; --ink:#eaedf6; --muted:#939cb4; --line:#272e45;
    --accent:#8c9bff; --accent-ink:#0e1220; --accent-soft:#222949; --accent-mid:#4f5aa8;
    --good:#6fd39a; --good-soft:#163225; --bad:#ff8a80; --bad-soft:#3b1d1b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
body.locked .app{display:none}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.page{flex:1;min-height:0;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 0}

.rows{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px;cursor:pointer}
.trow .nm{font-size:19px;font-weight:500;overflow-wrap:anywhere}
.trow .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.study{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 16px 12px}

.stage.static{cursor:default}
.prompt{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.prompt.long{font-weight:500;font-size:25px}
.map{width:min(100%,340px);aspect-ratio:1;display:block}
.smeter{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:2px 0 4px}
.smeter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.answer{font-size:20px;font-weight:600;color:var(--good);overflow-wrap:anywhere}
.hint{font-size:14px;color:var(--muted)}

.opt{min-height:54px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.opt:disabled{cursor:default;opacity:1}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

.actions.one{grid-template-columns:1fr}

.inline{display:flex;gap:8px}
.note{font-size:13px;color:var(--muted)}
.card{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.card .txt{flex:1;min-width:0}
.card .q{font-weight:500;overflow-wrap:anywhere}
.card .a{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.card.edit{flex-direction:column;align-items:stretch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .nm{font-weight:500;overflow-wrap:anywhere}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13px}

.dots{display:flex;flex-wrap:wrap;gap:3px}

.l1{background:var(--bad)} .l2{background:var(--accent-mid)} .l3{background:var(--accent)} .l4{background:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.counts{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.brain{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.brain svg{display:block;width:100%;height:auto;max-width:400px;margin:0 auto}
.brain text{font-family:var(--body)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end}
.day{display:flex;flex-direction:column;align-items:center;gap:4px}
.day .col{width:100%;height:64px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:4px;overflow:hidden}
.day .col i{display:block;width:100%}
.day .col .w{background:var(--accent-mid)} .day .col .c{background:var(--accent)} .day .col .z{background:var(--line);height:3px;border-radius:2px}
.day span{font-size:10px;color:var(--muted)}
.day.today span{color:var(--ink);font-weight:600}
.trk{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.trk:first-of-type{border-top:0;padding-top:0}
.trk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trk .nm{font-weight:600;overflow-wrap:anywhere}
.trk .pc{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.gap{background:var(--bad-soft);color:var(--bad)}
.pill.prog{background:var(--accent-soft);color:var(--accent)} .pill.none{background:var(--bg);color:var(--muted)}
.gapc{padding:8px 0;border-top:1px solid var(--line)}
.gapc:first-of-type{border-top:0;padding-top:0}
.gapc .q{font-weight:500;overflow-wrap:anywhere}
.gapc .a{font-size:14px;color:var(--good);overflow-wrap:anywhere}
.gapc .t{font-size:12px;color:var(--muted)}
.login{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.login .brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.01em}
.login .big,.login form{width:100%;max-width:300px}
.login form{display:flex;flex-direction:column;gap:10px}
.login input{min-height:54px;border-radius:14px;text-align:center;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px);z-index:5}
.toast button{background:transparent;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
</style>
</head>

<script>

function h(tag,attrs){
  var el=document.createElement(tag),i,k;
  if(attrs)for(k in attrs){
    if(k==="text")el.textContent=attrs[k];
    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),attrs[k]);

    else if(attrs[k]!==false&&attrs[k]!=null)el.setAttribute(k,attrs[k]);

function uid(p){return p+"-"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function byId(id){for(var i=0;i<topics.length;i++)if(topics[i].id===id)return topics[i];return null;}

function cards(t){return Array.isArray(t.cards)?t.cards:[];}
function findCard(t,id){var l=cards(t);for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function dueCards(t){var now=Date.now();return cards(t).filter(function(c){return (c.due||0)<=now;});}
/* 0 new, 1 missed, 2 learning, 3 strong, 4 mastered */
function level(c){if(!c.n)return 0;var b=c.box||0;return b===0?1:b<=2?2:b<=4?3:4;}
function mastery(list){if(!list.length)return 0;var s=0;list.forEach(function(c){s+=Math.min(c.box||0,MAXBOX)/MAXBOX;});return Math.round(100*s/list.length);}

function toast(msg,actionLabel,action){

/* ---------- saving ---------- */
function save(t){
  if(!sb)return;
  var row={id:t.id,name:t.name,ord:t.order||0,mode:t.mode||"mix",notes:t.notes||"",cards:JSON.parse(JSON.stringify(cards(t))),updated_at:new Date().toISOString()};

/* ---------- navigation ---------- */
function setTab(name){if(name==="topics"||name==="analytics")refreshTopics();tab=name;if(name==="topics")topicsView="list";render();}

/* ---------- the stream: an endless run of cards, picked at random and weighted toward what is weakest.
   "flash" runs in the Topics tab, "mcq" in the Qstream tab. ---------- */
var WEIGHT=[4,6,3,1.5,0.5]; /* new, missed, learning, strong, mastered */
function buildOptions(t,card){
  var wrong=[],seen={};seen[card.a.toLowerCase()]=1;
  function add(x){if(typeof x!=="string")return;x=x.trim();var k=x.toLowerCase();if(!x||seen[k])return;seen[k]=1;wrong.push(x);}
  (Array.isArray(card.opts)?card.opts:[]).forEach(add);
  if(wrong.length<3)shuffle(cards(t)).forEach(function(c){if(wrong.length<3&&c.id!==card.id)add(c.a);});
  if(wrong.length<2)return null;
  return shuffle([card.a].concat(wrong.slice(0,3)));
}
function step(t,kind){
  var s=sess[kind];
  if(!s||s.topicId!==t.id)s=sess[kind]={topicId:t.id,recent:[],cur:null};
  if(s.cur&&findCard(t,s.cur.id))return findCard(t,s.cur.id);
  s.cur=null;
  var list=cards(t);if(!list.length)return null;
  var k=Math.min(4,list.length-1),skip=k>0?s.recent.slice(-k):[],now=Date.now();
  var pool=list.filter(function(c){return skip.indexOf(c.id)<0;});if(!pool.length)pool=list;
  var total=0,ws=pool.map(function(c){var w=WEIGHT[level(c)]*((c.due||0)<=now?1.5:1);total+=w;return w;});
  var r=Math.random()*total,card=pool[pool.length-1];
  for(var i=0;i<pool.length;i++){r-=ws[i];if(r<=0){card=pool[i];break;}}
  var options=kind==="mcq"?buildOptions(t,card):null;
  s.cur={id:card.id,format:options?"mcq":"flash",options:options,chosen:null,revealed:false,missed:false};
  return card;
}
function pad(n){return n<10?"0"+n:""+n;}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function logReview(ok){
  var k=dayKey(),a=activity[k]||(activity[k]={reviews:0,correct:0});a.reviews++;if(ok)a.correct++;
  if(!sb)return;var row={day:k,reviews:a.reviews,correct:a.correct};
  actChain=actChain.then(function(){return sb.from("activity").upsert(row);}).catch(function(){});
}
function grade(kind,ok){
  var s=sess[kind];if(!s||!s.cur)return;var t=byId(s.topicId);if(!t)return;var id=s.cur.id;
  t.cards=cards(t).map(function(c){
    if(c.id!==id)return c;var n=Object.assign({},c);n.n=(n.n||0)+1;
    if(ok){n.box=Math.min((n.box||0)+1,MAXBOX);n.due=Date.now()+INTERVALS[n.box]*DAY;n.k=(n.k||0)+1;}
    else{n.box=0;n.due=Date.now();n.m=(n.m||0)+1;}
    return n;
  });
  s.recent.push(id);if(s.recent.length>8)s.recent.shift();
  s.cur=null;save(t);logReview(ok);render();
}
function activeKind(){return tab==="qstream"?"mcq":(tab==="topics"&&topicsView==="study")?"flash":null;}
function reveal(kind){var s=sess[kind];if(s&&s.cur&&!s.cur.revealed){s.cur.revealed=true;render();}}
function dontKnow(kind){var s=sess[kind];if(!s||!s.cur)return;if(s.cur.revealed)grade(kind,false);else{s.cur.revealed=true;s.cur.missed=true;render();}}
function choose(kind,opt){var s=sess[kind];if(s&&s.cur&&s.cur.chosen==null){s.cur.chosen=opt;render();}}

/* ---------- country maps (cards with a "map" field) ---------- */
var geo=null, geoState="idle";
var GEO_POINTS={"Tuvalu":[179.2,-8.5]};
function loadScript(src){return new Promise(function(res,rej){var e=document.createElement("script");e.src=src;e.onload=res;e.onerror=rej;document.head.appendChild(e);});}
function loadGeo(){
  if(geoState!=="idle")return;geoState="loading";
  loadScript("https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js")
    .then(function(){return loadScript("https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js");})

    .then(function(){return fetch("countries-50m.json");})
    .then(function(r){if(!r.ok)throw new Error("map");return r.json();})
    .then(function(topo){

/* The part of a country to centre and zoom on: its largest piece plus pieces within 30 degrees of it. */
function focusShape(f){
  var d3=window.d3,g=f.geometry;
  if(!g||g.type!=="MultiPolygon")return f;
  var polys=g.coordinates.map(function(c){return {type:"Polygon",coordinates:c};});
  var main=polys[0],best=-1;
  polys.forEach(function(p){var a=d3.geoArea(p);if(a>best){best=a;main=p;}});
  var mc=d3.geoCentroid(main),lim=30*Math.PI/180;
  var keep=polys.filter(function(p){return p===main||d3.geoDistance(mc,d3.geoCentroid(p))<lim;});
  return {type:"MultiPolygon",coordinates:keep.map(function(p){return p.coordinates;})};
}
function drawMap(canvas,name){
  var d3=window.d3,W=340,dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.width=W*dpr;canvas.height=W*dpr;
  var ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
  var cs=getComputedStyle(document.documentElement);
  function v(n){return cs.getPropertyValue(n).trim();}
  var f=geo.byName[name],focus=f?focusShape(f):null,center=focus?d3.geoCentroid(focus):(GEO_POINTS[name]||[0,0]);
  var proj=d3.geoOrthographic().rotate([-center[0],-center[1]]).translate([W/2,W/2]).scale(1);
  var size=0,scale=2600;
  if(focus){var b=d3.geoPath(proj).bounds(focus);size=Math.max(b[1][0]-b[0][0],b[1][1]-b[0][1]);scale=0.5*W/Math.max(size,1e-9);}
  scale=Math.min(Math.max(scale,W/2*0.96),2600);
  proj.scale(scale).clipExtent([[0,0],[W,W]]);
  var path=d3.geoPath(proj,ctx);
  ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=v("--surface");ctx.fill();
  ctx.beginPath();geo.features.forEach(function(x){if(x!==f)path(x);});
  ctx.fillStyle=v("--line");ctx.fill();ctx.strokeStyle=v("--surface");ctx.lineWidth=0.6;ctx.stroke();
  if(f){ctx.beginPath();path(f);ctx.fillStyle=v("--accent");ctx.fill();}
  if(!f||size*scale<16){ctx.beginPath();ctx.arc(W/2,W/2,13,0,2*Math.PI);ctx.strokeStyle=v("--accent");ctx.lineWidth=2.5;ctx.stroke();}
  ctx.beginPath();path({type:"Sphere"});ctx.strokeStyle=v("--line");ctx.lineWidth=1;ctx.stroke();
}

function sv(tag,attrs){
  var el=document.createElementNS("http://www.w3.org/2000/svg",tag),k;
  for(k in attrs){if(k==="text")el.textContent=attrs[k];else el.setAttribute(k,attrs[k]);}
  for(var i=2;i<arguments.length;i++)if(arguments[i])el.appendChild(arguments[i]);
  return el;
}
function topicStats(t){
  var list=cards(t),k=0,m=0,seen=0,counts=[0,0,0,0,0];
  list.forEach(function(c){k+=c.k||0;m+=c.m||0;if(c.n)seen++;counts[level(c)]++;});
  var pc=mastery(list),acc=(k+m)?Math.round(100*k/(k+m)):null;
  var state=!seen?"none":(acc!==null&&acc<60&&k+m>=5)?"gap":pc>=70?"good":"prog";
  return {t:t,pc:pc,acc:acc,k:k,m:m,seen:seen,total:list.length,counts:counts,state:state};
}
var STATE_LABEL={none:"Not started",gap:"Gap",good:"Strong",prog:"In progress"};
var STATE_COLOR={none:"var(--line)",gap:"var(--bad)",good:"var(--good)",prog:"var(--accent)"};
function brainMap(stats,overall){
  var N=stats.length,W=340,r=N<=6?30:N<=9?24:19,R=N===1?0:112,cx=W/2,cy=R+r+10,H=cy+R+r+26;
  var svg=sv("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Mastery by topic: "+stats.map(function(x){return x.t.name+" "+x.pc+"%";}).join(", ")});
  var pts=stats.map(function(x,i){var a=(-90+i*360/N)*Math.PI/180;return {x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),s:x};});
  if(N>1)pts.forEach(function(p){svg.appendChild(sv("line",{x1:cx,y1:cy,x2:p.x,y2:p.y,stroke:STATE_COLOR[p.s.state],"stroke-width":p.s.state==="none"?1:1+2*p.s.pc/100,"stroke-opacity":p.s.state==="none"?1:0.45,"stroke-linecap":"round"}));});
  if(N>1){
    svg.appendChild(sv("circle",{cx:cx,cy:cy,r:36,fill:"var(--ink)"}));
    svg.appendChild(sv("text",{x:cx,y:cy+3,"text-anchor":"middle","font-size":20,"font-weight":700,fill:"var(--bg)",text:overall+"%"}));
    svg.appendChild(sv("text",{x:cx,y:cy+18,"text-anchor":"middle","font-size":9,fill:"var(--bg)","fill-opacity":0.7,text:"overall"}));
  }
  pts.forEach(function(p){
    var C=2*Math.PI*r,col=STATE_COLOR[p.s.state],nm=p.s.t.name.length>17?p.s.t.name.slice(0,16)+"…":p.s.t.name;
    svg.appendChild(sv("circle",{cx:p.x,cy:p.y,r:r,fill:"var(--surface)",stroke:"var(--line)","stroke-width":5}));
    if(p.s.pc>0)svg.appendChild(sv("circle",{cx:p.x,cy:p.y,r:r,fill:"none",stroke:col,"stroke-width":5,"stroke-linecap":"round","stroke-dasharray":(C*p.s.pc/100)+" "+C,transform:"rotate(-90 "+p.x+" "+p.y+")"}));
    svg.appendChild(sv("text",{x:p.x,y:p.y+4.5,"text-anchor":"middle","font-size":r>=30?13:11,"font-weight":700,fill:"var(--ink)",text:p.s.pc+"%"}));
    svg.appendChild(sv("text",{x:p.x,y:p.y+r+15,"text-anchor":"middle","font-size":10.5,"font-weight":500,fill:"var(--muted)",text:nm}));
  });
  return svg;
}
function renderAnalytics(m){

  var stats=topics.map(topicStats),all=[];topics.forEach(function(t){all=all.concat(cards(t));});
  var overall=mastery(all),K=0,M=0;stats.forEach(function(x){K+=x.k;M+=x.m;});

  for(i=13;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-i);days.push({key:dayKey(x),date:x});}

  });
  p.appendChild(h("div",{class:"panel"},h("div",{class:"phead"},h("h2",{text:"Last 14 days"}),h("span",{class:"note",text:total14?"dark = known, light = missed":"no answers yet"})),grid));

  var by=h("div",{class:"panel"},h("h2",{text:"Strongest to weakest"}));
  stats.slice().sort(function(a,b){return b.pc-a.pc;}).forEach(function(x){
    var seg=h("div",{class:"seg",role:"img","aria-label":x.pc+"% mastered"});
    [4,3,2,1].forEach(function(l){if(!x.counts[l])return;var e=h("i",{class:"l"+l});e.style.width=(100*x.counts[l]/Math.max(x.total,1))+"%";seg.appendChild(e);});
    by.appendChild(h("div",{class:"trk"},
      h("div",{class:"top"},h("span",{class:"nm",text:x.t.name}),h("span",{class:"pc",text:x.pc+"%"})),
      seg,
      h("div",{class:"row"},h("span",{class:"pill "+x.state,text:STATE_LABEL[x.state]}),
        h("span",{class:"note",text:(x.total?Math.round(100*x.seen/x.total):0)+"% explored"+(x.acc!==null?" · "+x.acc+"% accuracy":"")}))));
  });
  var names=["","Missed","Learning","Strong","Mastered"],lg2=h("div",{class:"legend"});
  [4,3,2,1].forEach(function(l){lg2.appendChild(h("span",null,h("i",{class:"dot l"+l}),names[l]));});
  by.appendChild(lg2);

  var weak=[];

      h("div",{class:"q",text:w.c.map?"Find on the map":w.c.q}),h("div",{class:"a",text:w.c.a}),
      h("div",{class:"t",text:w.t.name+" · missed "+w.c.m+(w.c.m===1?" time":" times")})));

document.addEventListener("keydown",function(e){
  var kind=activeKind();if(!kind||!sess[kind]||!sess[kind].cur||e.metaKey||e.ctrlKey||e.altKey)return;
  var tag=(e.target&&e.target.tagName)||"";if(tag==="INPUT"||tag==="TEXTAREA")return;
  var s=sess[kind].cur,t=byId(sess[kind].topicId);if(!t)return;var card=findCard(t,s.id);if(!card)return;
  if(s.format==="mcq"){
    var n=parseInt(e.key,10);
    if(s.chosen==null&&n>=1&&n<=s.options.length){e.preventDefault();choose(kind,s.options[n-1]);}
    return;
  }
  if(s.missed)return;

/* ---------- sign-in and loading ---------- */
function seedTopics(){
  var S=window.RV_SEED;if(!S)return [];
  return [
    {id:"syauctus",name:"Syauctus",order:1,mode:"mix",notes:S.syauctus.notes,cards:S.syauctus.cards.map(function(c,i){return {id:"s"+(i+1),q:c[0],a:c[1],opts:c[2]};})},
    {id:"world-geography",name:"World geography",order:2,mode:"know",notes:S.geography.notes,cards:S.geography.rows.map(function(r,i){var p=r.split("|");return {id:"g"+(i+1),q:p[0],a:p[1]+" · "+p[2]};})}
  ];
}
function loadActivity(){
  sb.from("activity").select("*").order("day",{ascending:false}).limit(60).then(function(r){
    if(r.error)return;
    r.data.forEach(function(row){var c=activity[row.day];if(!c||row.reviews>c.reviews)activity[row.day]={reviews:row.reviews,correct:row.correct};});
    if(tab==="analytics"&&status==="ready")render();
  },function(){});
}
function loadTopics(){
  status="loading";render();loadActivity();
  sb.from("topics").select("*").order("ord").then(function(r){
    if(r.error){status="unreachable";render();return;}
    if(!r.data.length){topics=seedTopics();topics.forEach(save);}
    else topics=r.data.map(function(row){return {id:row.id,name:row.name,order:row.ord,mode:row.mode,notes:row.notes,cards:Array.isArray(row.cards)?row.cards:[]};});
    status="ready";lastLoad=Date.now();render();
  },function(){status="unreachable";render();});
}
var lastLoad=0;
function refreshTopics(){
  if(!sb||status!=="ready"||Date.now()-lastLoad<15000)return;
  var a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))return;
  lastLoad=Date.now();
  var pending=Object.keys(writeChain).map(function(k){return writeChain[k];});
  Promise.all(pending).then(function(){return sb.from("topics").select("*").order("ord");}).then(function(r){
    if(r.error||!r.data.length)return;
    topics=r.data.map(function(row){return {id:row.id,name:row.name,order:row.ord,mode:row.mode,notes:row.notes,cards:Array.isArray(row.cards)?row.cards:[]};});
    render();
  },function(){});
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")refreshTopics();});
var loginEl=document.getElementById("login"),passForm=document.getElementById("passForm"),passIn=document.getElementById("pass"),loginMsg=document.getElementById("loginMsg"),whoBtn=document.getElementById("whoBtn");
function showLogin(msg){document.body.classList.add("locked");loginEl.hidden=false;passForm.hidden=true;whoBtn.hidden=false;passIn.value="";loginMsg.textContent=msg||"";}
function unlock(){document.body.classList.remove("locked");loginEl.hidden=true;tab="topics";topicsView="list";loadTopics();}
function logOut(){
  if(!sb)return;
  function done(){topics=[];activity={};sess={flash:null,mcq:null};showLogin();}
  sb.auth.signOut().then(done,done);
}
whoBtn.addEventListener("click",function(){whoBtn.hidden=true;passForm.hidden=false;loginMsg.textContent="";passIn.focus();});
passForm.addEventListener("submit",function(e){
  e.preventDefault();if(!sb)return;var btn=document.getElementById("enterBtn");btn.disabled=true;loginMsg.textContent="";
  sb.auth.signInWithPassword({email:OWNER,password:passIn.value}).then(function(r){
    btn.disabled=false;
    if(r.error){loginMsg.textContent=/invalid/i.test(r.error.message||"")?"Wrong passcode. Try again.":"Sign-in failed. Check your connection and try again.";passIn.select();return;}
    unlock();
  },function(){btn.disabled=false;loginMsg.textContent="Sign-in failed. Check your connection and try again.";});
});
if(!sb){document.body.classList.remove("locked");status="local";render();}
else sb.auth.getSession().then(function(r){if(r.data&&r.data.session)unlock();else showLogin();},function(){showLogin();});
})();
